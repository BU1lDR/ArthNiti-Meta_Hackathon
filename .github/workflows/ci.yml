# Rebuilds the app from this repository (node assemble.mjs: the pinned commit of the
# earlier repository, plus the patches, plus the added files, checked against the
# author's tree hash), then runs the same checks as the author's CI: the ones that
# need no server and no browser. The browser gates in tools/verify/ drive a local
# Edge over CDP and are not run here.

name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  backend:
    name: backend (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # 3.10 is the Requires-Python floor of the pinned set; 3.14 is what
        # the author runs. Quoted, or YAML reads 3.10 as the number 3.1.
        python-version: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # assemble.mjs is Node, and it has to run before setup-python, whose
      # cache key reads a file that only exists once the app is rebuilt.
      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Rebuild the app (fails unless it is the author's tree, byte for byte)
        run: node assemble.mjs app

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: app/backend/requirements*.txt

      - name: Install the pinned runtime and test dependencies
        run: python -m pip install -r app/backend/requirements-dev.txt

      # From backend/ and through `python -m`, which puts the working directory
      # on the path, so that `import app` resolves.
      - name: pytest
        working-directory: app/backend
        run: python -m pytest tests -q

  frontend:
    name: frontend and dictionary checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Rebuild the app (fails unless it is the author's tree, byte for byte)
        run: node assemble.mjs app

      - name: npm ci
        working-directory: app/frontend
        run: npm ci

      - name: npm run lint
        working-directory: app/frontend
        run: npm run lint

      - name: npm run build
        working-directory: app/frontend
        # vite.config.js refuses a production build whose API URL is not https.
        # This build is never deployed, so it gets a placeholder that cannot
        # resolve (.invalid is reserved by RFC 2606).
        env:
          VITE_API_BASE_URL: https://api.example.invalid
        run: npm run build

      - name: i18n key parity (tools/parity4.mjs)
        working-directory: app
        run: node tools/parity4.mjs

      - name: key use vs definition (tools/keycheck.mjs)
        working-directory: app
        run: node tools/keycheck.mjs

      - name: market fetch maths and guards (no network)
        working-directory: app
        run: node --test tools/verify/market-lib-test.mjs

      - name: egg-price fetch maths and guards (no network)
        working-directory: app
        run: node --test tools/verify/necc-lib-test.mjs

      # One test in talk-lib-test hands a recording to the backend through the
      # Windows virtual environment, so it is skipped here.
      - name: /talk recording and answer logic
        working-directory: app
        run: node --test tools/verify/talk-lib-test.mjs

      - name: stored application state
        working-directory: app
        run: node --test tools/verify/app-state-test.mjs

      - name: read-aloud voice choice and speech queue (no network)
        working-directory: app
        run: node --test tools/verify/speak-lib-test.mjs

      # Informational: it prints its hits and exits 0 whenever it ran, so only
      # a crash (exit 2) fails this step.
      - name: decorative glyph audit (informational)
        working-directory: app
        run: node tools/verify/glyph-audit.mjs
